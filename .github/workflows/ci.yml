name: CI

on:
  push:
    branches: [main, "codex/**"]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install and verify FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
          ffmpeg -version
          ffprobe -version
          ffmpeg -hide_banner -encoders | grep libx264
          ffmpeg -hide_banner -decoders | grep h264
      - name: Install backend dependencies
        run: python -m pip install -r requirements.txt
      - name: Compile Python sources
        run: python -m compileall -q app.py client_app.py node_app.py controllers media models repositories routes services tests tools utils watermark
      - name: Run backend tests
        run: python -m unittest discover -s tests -v

  frontend:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci
      - name: Build frontend
        working-directory: frontend
        run: npm run build

  docker-validation:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Validate Compose configuration
        run: docker compose config --quiet
      - name: Build container images
        run: docker compose build
      - name: Run backend tests in the backend image
        run: docker compose run --rm --no-deps backend python -m unittest discover -s tests -v
      - name: Smoke test the composed stack
        run: |
          set -euo pipefail
          trap 'docker compose logs --tail=200; docker compose down -v' EXIT
          docker compose up -d
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:5000/health >/dev/null; then break; fi
            if [ "$attempt" = "30" ]; then exit 1; fi
            sleep 2
          done
          curl --fail --silent --show-error \
            -H 'Content-Type: application/json' \
            -d '{"chunk":0}' \
            http://127.0.0.1:5000/api/security/watermark/demo >/dev/null
          for attempt in $(seq 1 20); do
            if curl --fail --silent http://127.0.0.1:8080/ >/dev/null; then exit 0; fi
            sleep 1
          done
          exit 1
